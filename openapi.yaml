openapi: 3.0.4
info:
  title: Mortgage Rate
  description: >-
    Mortgage Rate reports weekly US fixed mortgage rates for 15-year and 30-year
    terms. Pass the loan term to get the latest percentage rate, survey date,
    and direction of weekly change, while paid plans add 4-week and 52-week
    changes, the 52-week high, low and average, and the last 52 weekly rates.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/mortgagerate:
    get:
      summary: Mortgage Rate
      description: >-
        Get the current or historical mortgage rate for a specific type. The
        current rate includes its 1, 4 and 52-week changes and the 52-week
        range.
      operationId: mortgagerate
      parameters:
        - name: type
          in: query
          schema:
            type: string
          required: true
          description: The mortgage type
          example: 30year
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: Year to retrieve rates for (1971-present). Requires month parameter.
          example: 2023
        - name: month
          in: query
          schema:
            type: integer
          required: false
          description: Month to retrieve rates for (1-12). Required when year is specified.
          example: 6
        - name: history
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the weekly rates for the 52 weeks ending at the latest
            survey (current rate only)
          example: true
        - name: changes
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the 4-week and 52-week changes and the 52-week high, low and
            average (current rate only)
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  rateType: 30year
                  name: 30-Year Fixed Rate Mortgage
                  term: 30
                  type: fixed
                  country: US
                  year: 2026
                  count: 1
                  rates:
                    - week: '2026-10-22'
                      rate: 7.32
                  change1w: -0.08
                  changeDirection: down
                  previousRate: 7.4
                  previousDate: '2026-10-15'
                  change4w: 0.29
                  change52w: 1.13
                  high52w: 7.4
                  low52w: 5.98
                  average52w: 6.4423
